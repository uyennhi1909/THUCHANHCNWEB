<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu phần 3 câu 14</title>
    <style>
        *{ 
            color: mediumvioletred;}
        h1{ text-align: center;}
        .P3_C14 {
            background-color: lavenderblush;
            color: mediumvioletred;
            border: 2px solid mediumvioletred;
            border-radius: 15px;
            padding: 20px;}
        input{
            padding: 20px;
            width: 100%
            transform: scale(1.2);
            accent-color: hotpink;}
        button:hover{
            background-color: hotpink;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;}
    </style>
</head>
<body>
    <h1> Form phản hồi khách hàng </h1>
    <div class =  "P3_C14">
        <form>
            <h2> Đánh giá của khách hàng </h2>
            <div class="star">
                <input type="radio" id="1sao" name="rate" value="1">
                <label for="1sao">★</label><br>
                <input type="radio" id="2sao" name="rate" value="2">
                <label for="2sao">★★</label><br>
                <input type="radio" id="3sao" name="rate" value="3">
                <label for="3sao">★★★</label><br>
                <input type="radio" id="4sao" name="rate" value="4">
                <label for="4sao">★★★★</label><br>
                <input type="radio" id="5sao" name="rate" value="5">
                <label for="5sao">★★★★★</label><br>
            </div>
            <br>
            <h2> Email của khách hàng </h2> 
            <input type = "email"/>
            <h2> Ý kiến của khách hàng </h2>
            <textarea name="opinion" id="op1" cols="50" rows="10"></textarea>
            <br><br>
            <button type="submit"> Xác nhận gửi phản hồi </button> 
            <button type="reset"> Xoá phản hồi </button> 
        </form>
    </div>
</body>
</html>
