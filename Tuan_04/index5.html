<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaiTap5</title>
</head>

<body>
    <div class="Bai5">
        <h3>Tính tổng có kiểm tra</h3>
        <div>
            <label for="num1">Điền số thứ nhất</label>
            <input id="num1">
        </div>
        <div>
            <label for="num2">Điền số thứ hai</label>
            <input id="num2">
        </div>
        <div>
            <button onclick="Bai5()">Tính tổng</button>
            <p id="sum"></p>
        </div>
    </div>
    <script>
        function Bai5() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            if (num1 == "" || num2 == "") {
                document.getElementById("sum").innerText = "Bạn chưa nhập số";
                return;
            }
            else if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("sum").innerText = "Bạn nhập không phải số";
                return;
            }
            else {
                var sum = Number(num1) + Number(num2);
                console.log("Tổng 2 số là: " + sum);
                document.getElementById("sum").innerText = "Tổng 2 số là: " + sum;
            }

        }
    </script>
</body>

</html>
