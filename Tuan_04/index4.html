<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaiTap4</title>
</head>

<body>
    <div class="Bai4">
        <h3>Bài 4: Tính tổng 2 số</h3>
        <div>
            <label for="num1">Điền số thứ nhất</label>
            <input id="num1">
        </div>
        <div>
            <label for="num2">Điền số thứ hai</label>
            <input id="num2">
        </div>
        <div>
            <button onclick="Bai4()">Tính tổng</button>
            <p id="sum"></p>
        </div>
    </div>
    <script>
        function Bai4(){
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var sum = Number(num1) + Number(num2);
            console.log("Tổng 2 số là: " + sum);
            document.getElementById("sum").innerText = "Tổng 2 số là: " + sum;
        }
    </script>
</body>

</html>
