<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaiTap1</title>
</head>

<body>
    <!-- 1. JS-> Tên-> click button-> console
	Nguyen Van A-> console-> Hello A -->
    <div class="Bai1">
        <h3>Bài 1: Nhập tên và in ra</h3>
        <input type="text" id="name" placeholder="Nhập tên của bạn">
        <button onclick="Bai1()">Click</button>
    </div>
    <script>
        function Bai1() {
            var name = document.getElementById("name").value;
            console.log("Hello " + name)
        }
    </script>

</body>

</html>
