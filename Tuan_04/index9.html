<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaiTap4_NangCao</title>
</head>

<body>
    <div class="Bai4_NC">
        <h3>Bài tập 4 nâng cao: Check ngày tháng năm (DD-MM-YYYY)</h3>
        <input type="text" id="input" placeholder="DD-MM-YYYY">
        <button onclick="Bai4_NC()">Kiểm tra</button>
        <p id="output"></p>
    </div>
    <script>
        function Bai4_NC() {
            var input = document.getElementById("input").value;
            var kiemtra = /^\d{2}-\d{2}-\d{4}$/;
            if (!kiemtra.test(input)) {
                document.getElementById("output").innerText = "Định dạng ngày tháng không hợp lệ";
            }
            var phan = input.split("-");
            var ngay = Number(phan[0]);
            var thang = Number(phan[1]);
            var nam = Number(phan[2]);
            var date = new Date(nam, thang - 1, ngay);
            console.log(date);
            if (date.getDate() == ngay && date.getMonth() == thang - 1 && date.getFullYear() == nam) {
                document.getElementById("output").innerText = "Ngày tháng năm hợp lệ";
            }
            else {
                document.getElementById("output").innerText = "Ngày tháng năm không hợp lệ";
            }
        }
    </script>
</body>

</html>
