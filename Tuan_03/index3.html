<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu phần 3 câu 11 và câu 12</title>
    <style>
        body{
            background-color: lavenderblush;
            color: mediumvioletred;
            border-radius: 5px;
            text-align: left;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        h1,h2{
            margin-bottom: 10px; 
            margin-top: 10px;
        }
        input {
            color: mediumvioletred;
            border: 1px solid hotpink;
            border-radius: 5px;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .P3_C11 input[type = "text"], .P3_C11 input[type = "password"]{
            box-shadow: 5px 5px;
        }
        input[type="submit"]:hover{
            background-color: hotpink;
            color: white;
            transform:scale(1.05);
        }
        select{
            color: mediumvioletred;
        }
        input[type="radio"], input[type="checkbox"]{
            accent-color: hotpink;
        } 
        .P3_C11{
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid;
            padding: 10px 100px;
            border-radius: 10px;
        }
        input[type="submit"]{
            display: block;
            border: 3px solid mediumvioletred;
            padding: 3px ;
            margin-top: 10px;
        }
        .P3_C11 input:focus{
            background-color: lightpink;
        }
        .gender, .fvcolor{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
        }
        h1{
            text-align: center;
        }
        textarea{
            width: 100%;
            border-radius: 5px;
            border: 2px solid mediumvioletred;
        }
        .P3_C12{
            border: 5px double;
            padding: 40px;
            border-radius: 20px;
        }
        .button{
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class  = "P3_C11">
    <h1> Đăng nhập </h1>
    <form>
        Username: <input type = "text" name = "username"/>
        <br>
        Password: <input type = "password" name = "password"/>
        <br>
        <div class="button">
            <input type = "submit" value = "Đăng nhập"/> 
        </div>
    </form>
    </div>
    <div class = "P3_C12">
    <h1> Khảo sát ý kiến </h1>
    <form>
        <h2> Giới tính của bạn là gì? </h2>
        <div class = "gender">
            <input type = "radio" name = "gioitinh" value = "Nam"/> Nam
            <input type = "radio" name = "gioitinh" value = "Nữ"/> Nữ
            <input type = "radio" name = "gioitinh" value = "Khác"/> Khác
        </div>
        <h2> Bạn là sinh viên năm mấy? </h2>
        Tôi là sinh viên 
        <select>
            <option value="Năm 1"> Năm 1 </option>
            <option value="Năm 2"> Năm 2 </option>
            <option value="Năm 3"> Năm 3 </option>
            <option value="Năm 4"> Năm 4 </option>
        </select>
        <h2> Bạn thích màu gì? </h2>
        <div class="fvcolor">
            <input type = "checkbox" name = "corlor"/> Đỏ <br>
            <input type = "checkbox" name = "corlor"/> Cam <br>
            <input type = "checkbox" name = "corlor"/> Vàng <br>
            <input type = "checkbox" name = "corlor"/> Lục <br>
            <input type = "checkbox" name = "corlor"/> Lam <br>
            <input type = "checkbox" name = "corlor"/> Chàm <br>
            <input type = "checkbox" name = "corlor"/> Tím <br>
            <input type = "checkbox" name = "corlor"/> Hồng <br>
        </div>
        <h2> Góp ý </h2>
        <textarea name="opinion" id="op1" cols="50" rows="5"></textarea>
        <br>
        <div class="button">
            <input type = "submit" value = "Xác nhận gửi"/> 
        </div>
    </form>
    </div>
</body>
</html>
