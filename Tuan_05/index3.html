<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập nhập vào ngày sinh, hoặc chọn ngày, chỉ cho phép trước ngày hiện tại</title>
    <style>
        .error {
            color: red;
        }
        
        .success {
            color: blue;
        }
    </style>
</head>

<body>
    <input type="date" id="input">
    <button onclick="check()">Kiểm tra</button>
    <p id="output"></p>
    <script>
        function check() {
            var input = document.getElementById("input").value;
            console.log(input);

            var inputdate = new Date(input);
            console.log(inputdate);

            var today = new Date();
            console.log(today);

            if (inputdate < today) {
                console.log("past");
                document.getElementById("output").innerText = "Ngày sinh hợp lệ";
                output.className = "success";
            } else {
                console.log("error");
                document.getElementById("output").innerText = "Ngày sinh không hợp lệ";
                output.className = "error";
            }
        }
    </script>
</body>

</html>
